# The public deployment, layered on docker-compose.yml:
#   docker compose --env-file deploy/.env -f docker-compose.yml -f deploy/compose.public.yml up -d
# Only Caddy listens publicly (80/443, Cloudflare's ranges only; see
# deploy/Caddyfile); it sets the X-Client-IP the API's limits count by. The
# API is also on 127.0.0.1:8080 for checks on the server. Postgres has no
# published port and is sized for a 2 GB server.
# Settings come from deploy/.env (git-ignored; see deploy/.env.example).
services:
  db:
    ports: !reset []
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=30
    restart: unless-stopped

  api:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      OPENTAXRATE_CACHE_HOURS: "6"
      OPENTAXRATE_PUBLIC_LIMIT: ${OPENTAXRATE_PUBLIC_LIMIT:-10/min,300/day}
      OPENTAXRATE_SUGGEST_LIMIT: ${OPENTAXRATE_SUGGEST_LIMIT:-120/min}
      OPENTAXRATE_CLIENT_IP_HEADER: X-Client-IP
      OPENTAXRATE_PHOTON_URL: ${OPENTAXRATE_PHOTON_URL:-}

  caddy:
    image: caddy:2
    # The folder, not the file: a single bound file keeps its old copy when
    # an edit replaces it, and a reload would read stale rules.
    command: ["caddy", "run", "--config", "/etc/opentaxrate/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST:-api.opentaxrate.com}
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in deploy/.env}
    volumes:
      - ./deploy:/etc/opentaxrate:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on: [api]

volumes:
  caddy_data:
