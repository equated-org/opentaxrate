# docker compose up -d                 Postgres + the API on :8080
# docker compose run --rm refresh      download and load every state (~45 min first time)
# docker compose run --rm refresh OH TX   just some states
services:
  db:
    build: ./db
    image: opentaxrate-db:17-postgis
    environment:
      POSTGRES_USER: opentaxrate
      POSTGRES_PASSWORD: opentaxrate
      POSTGRES_DB: opentaxrate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentaxrate"]
      interval: 5s
      retries: 20

  migrate:
    build: .
    command: ["migrate"]
    environment: &env
      DATABASE_URL: postgres://opentaxrate:opentaxrate@db:5432/opentaxrate
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      NOMINATIM_DISABLED: ${NOMINATIM_DISABLED:-false}
      PHOTON_URL: ${PHOTON_URL:-}
      PELIAS_URL: ${PELIAS_URL:-}
      GEOCODIO_API_KEY: ${GEOCODIO_API_KEY:-}
      SMARTY_AUTH_ID: ${SMARTY_AUTH_ID:-}
      SMARTY_AUTH_TOKEN: ${SMARTY_AUTH_TOKEN:-}
      HERE_API_KEY: ${HERE_API_KEY:-}
      ARCGIS_API_KEY: ${ARCGIS_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_PERMANENT: ${MAPBOX_PERMANENT:-false}
      ARCGIS_FOR_STORAGE: ${ARCGIS_FOR_STORAGE:-false}
      OPENTAXRATE_GEOCODE_CACHE: ${OPENTAXRATE_GEOCODE_CACHE:-on}
      OPENTAXRATE_GEOCODE_READ_ONLY: ${OPENTAXRATE_GEOCODE_READ_ONLY:-false}
      CENSUS_DISABLED: ${CENSUS_DISABLED:-false}
      CENSUS_DAILY_CAP: ${CENSUS_DAILY_CAP:-100000}
      CENSUS_RATE_PER_SECOND: ${CENSUS_RATE_PER_SECOND:-10}
      CENSUS_COST_PER_CALL: ${CENSUS_COST_PER_CALL:-0}
      PHOTON_DAILY_CAP: ${PHOTON_DAILY_CAP:-100000}
      PHOTON_RATE_PER_SECOND: ${PHOTON_RATE_PER_SECOND:-10}
      PHOTON_COST_PER_CALL: ${PHOTON_COST_PER_CALL:-0}
      PELIAS_DAILY_CAP: ${PELIAS_DAILY_CAP:-100000}
      PELIAS_RATE_PER_SECOND: ${PELIAS_RATE_PER_SECOND:-10}
      PELIAS_COST_PER_CALL: ${PELIAS_COST_PER_CALL:-0}
      GEOCODIO_DAILY_CAP: ${GEOCODIO_DAILY_CAP:-2500}
      GEOCODIO_RATE_PER_SECOND: ${GEOCODIO_RATE_PER_SECOND:-5}
      GEOCODIO_COST_PER_CALL: ${GEOCODIO_COST_PER_CALL:-0.0005}
      SMARTY_DAILY_CAP: ${SMARTY_DAILY_CAP:-100}
      SMARTY_RATE_PER_SECOND: ${SMARTY_RATE_PER_SECOND:-5}
      SMARTY_COST_PER_CALL: ${SMARTY_COST_PER_CALL:-0.001}
      MAPBOX_DAILY_CAP: ${MAPBOX_DAILY_CAP:-300}
      MAPBOX_RATE_PER_SECOND: ${MAPBOX_RATE_PER_SECOND:-5}
      MAPBOX_COST_PER_CALL: ${MAPBOX_COST_PER_CALL:-0.001}
      HERE_DAILY_CAP: ${HERE_DAILY_CAP:-300}
      HERE_RATE_PER_SECOND: ${HERE_RATE_PER_SECOND:-5}
      HERE_COST_PER_CALL: ${HERE_COST_PER_CALL:-0.001}
      ARCGIS_DAILY_CAP: ${ARCGIS_DAILY_CAP:-300}
      ARCGIS_RATE_PER_SECOND: ${ARCGIS_RATE_PER_SECOND:-5}
      ARCGIS_COST_PER_CALL: ${ARCGIS_COST_PER_CALL:-0.004}
      GOOGLE_DAILY_CAP: ${GOOGLE_DAILY_CAP:-300}
      GOOGLE_RATE_PER_SECOND: ${GOOGLE_RATE_PER_SECOND:-5}
      GOOGLE_COST_PER_CALL: ${GOOGLE_COST_PER_CALL:-0.005}
      OPENTAXRATE_USER_AGENT: ${OPENTAXRATE_USER_AGENT:-}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    command: ["serve"]
    environment: *env
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  refresh:
    build: .
    entrypoint: ["node", "dist/cli.js", "refresh"]
    command: []
    environment:
      <<: *env
      OPENTAXRATE_DOWNLOAD_DIR: ${OPENTAXRATE_DOWNLOAD_DIR:-/artifacts}
    volumes:
      - ./data:/data
      - ./artifacts:/artifacts
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
